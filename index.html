<style>
  :root{
    --paper:#F6F1E4;
    --paper-raised:#FFFDF7;
    --ink:#1B2A33;
    --ink-soft:#4A5A62;
    --blue:#1F4E6B;
    --blue-tint:#E3EDF1;
    --blue-line:#C7D9DF;
    --terracotta:#B15A3E;
    --terracotta-tint:#F5E3DC;
    --ochre:#B4832C;
    --ochre-tint:#F2E7D2;
    --sage:#4C7358;
    --sage-tint:#E2ECE2;
    --hairline:#D9D2BE;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}

  /* ---------- Header ---------- */
  header{
    background:var(--blue);
    color:var(--paper);
    padding:28px 20px 22px;
    position:relative;
    overflow:hidden;
    border-bottom:3px solid var(--terracotta);
  }
  header .tiles{
    position:absolute; inset:0;
    background-image:
      linear-gradient(45deg, rgba(255,255,255,.045) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(255,255,255,.045) 25%, transparent 25%);
    background-size:34px 34px;
    opacity:.6;
    pointer-events:none;
  }
  header .inner{position:relative; max-width:640px; margin:0 auto;}
  header .eyebrow{
    font-size:12.5px;
    letter-spacing:.02em;
    color:#BFD6E1;
    margin:0 0 6px;
  }
  header h1{
    font-size:26px;
    font-weight:600;
    margin:0 0 4px;
    line-height:1.15;
  }
  header .sub{
    font-size:13.5px;
    color:#CFE0E8;
    margin:0 0 18px;
  }
  .countdown-row{
    display:flex; gap:14px; align-items:flex-end;
    margin-bottom:16px;
  }
  .countdown-num{font-size:40px; font-weight:600; line-height:1;}
  .countdown-label{font-size:12.5px; color:#CFE0E8; padding-bottom:4px;}
  .progress-shell{
    background:rgba(255,255,255,.16);
    border-radius:20px;
    height:8px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--terracotta);
    border-radius:20px;
    transition:width .4s ease;
  }
  .progress-caption{
    font-size:12px; color:#CFE0E8; margin-top:7px;
    display:flex; justify-content:space-between;
  }

  /* ---------- Global add bar ---------- */
  .global-add{
    background:var(--blue-tint);
    border-bottom:1px solid var(--blue-line);
  }
  .global-add-inner{
    max-width:640px; margin:0 auto;
    padding:14px 20px 4px;
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .global-add-hint{
    max-width:640px; margin:0 auto;
    padding:0 20px 12px;
    font-size:12px;
    color:var(--blue);
    font-weight:600;
  }

  /* ---------- Tabs ---------- */
  .tabbar{
    max-width:640px; margin:0 auto;
    display:flex; gap:8px;
    padding:14px 20px 0;
  }
  .tabbtn{
    flex:1;
    font-family:'Space Grotesk',sans-serif;
    font-size:14px; font-weight:600;
    padding:10px 12px;
    border:1px solid var(--hairline);
    background:var(--paper-raised);
    color:var(--ink-soft);
    cursor:pointer;
    border-radius:var(--radius);
  }
  .tabbtn.active{
    background:var(--blue);
    color:var(--paper);
    border-color:var(--blue);
  }

  main{max-width:640px; margin:0 auto; padding:16px 20px 8px;}

  /* ---------- Month box (mês seletor) ---------- */
  .month-box{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--paper);
    padding:12px 0 16px;
    margin-bottom:4px;
  }
  .month-select{position:relative;}
  .month-select-trigger{
    width:100%;
    display:flex; align-items:center; justify-content:space-between;
    font-family:'Space Grotesk',sans-serif;
    font-size:14.5px; font-weight:600;
    padding:12px 14px;
    border:1px solid var(--blue-line);
    border-radius:8px;
    background:var(--paper-raised);
    color:var(--ink);
    cursor:pointer;
  }
  .month-select-trigger .chevron{
    width:8px; height:8px;
    border-right:2px solid var(--ink-soft);
    border-bottom:2px solid var(--ink-soft);
    transform:rotate(45deg);
    transition:transform .2s ease;
    flex-shrink:0;
  }
  .month-select-trigger .chevron.open{transform:rotate(-135deg);}
  .month-select-panel{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:var(--paper-raised);
    border:1px solid var(--blue-line);
    border-radius:8px;
    box-shadow:0 8px 22px rgba(27,42,51,.14);
    max-height:320px; overflow-y:auto;
    z-index:20;
  }
  .month-option{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 14px;
    font-size:14px; font-weight:500;
    color:var(--ink);
    cursor:pointer;
    border-bottom:1px solid #ECE6D6;
  }
  .month-option:last-child{border-bottom:none;}
  .month-option:hover{background:var(--blue-tint);}
  .month-option.selected{background:var(--blue); color:var(--paper); font-weight:600;}
  .month-option-count{font-size:12px; opacity:.8;}

  /* ---------- Section (accordion group) ---------- */
  .group{
    background:var(--paper-raised);
    border:1px solid var(--hairline);
    margin-bottom:12px;
    border-radius:var(--radius);
    overflow:hidden;
  }
  .group.is-current{border-color:var(--blue);}
  .group-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    cursor:pointer;
    gap:10px;
  }
  .group-head:active{background:var(--blue-tint);}
  .group-title-wrap{min-width:0;}
  .group-title{font-size:16.5px; font-weight:600; margin:0; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .group-badge{font-size:12px; color:var(--ink-soft); font-weight:400; font-family:'Space Grotesk',sans-serif;}
  .group-badge.subtitle-badge{color:var(--blue); font-weight:600;}
  .group-badge.current-badge{color:var(--sage); font-weight:600;}
  .group-meta{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .group-count{font-size:12px; color:var(--ink-soft); white-space:nowrap;}
  .chevron{
    width:9px; height:9px;
    border-right:2px solid var(--ink-soft);
    border-bottom:2px solid var(--ink-soft);
    transform:rotate(45deg);
    transition:transform .2s ease;
    flex-shrink:0;
  }
  .group.open .chevron{transform:rotate(-135deg);}

function pad2(n){ return String(n).padStart(2,'0'); }
function monthKeyFromDate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`; }
function monthTitle(key){
  const [y,m] = key.split('-').map(Number);
  return `${MONTH_NAMES_PT[m-1]} ${y}`;
}
function monthShort(key){
  const [y,m] = key.split('-').map(Number);
  return `${MONTH_SHORT_PT[m-1]} ${y}`;
}
function addMonths(key, n){
  let [y,m] = key.split('-').map(Number);
  m += n;
  while(m>12){ m-=12; y++; }
  while(m<1){ m+=12; y--; }
  return `${y}-${pad2(m)}`;
}
function isMonthKey(k){ return /^\d{4}-\d{2}$/.test(k); }

function getMonthSection(key){
  const base = MONTHS_BASE.find(m => m.id === key);
  if(base) return base;
  return {id:key, title:monthTitle(key), subtitle:'', items:[]};
}

function visibleMonthKeys(){
  const todayKey = monthKeyFromDate(new Date());
  const keys = new Set();
  MONTHS_BASE.forEach(m => keys.add(m.id));
  Object.keys(customItems).forEach(k => { if(isMonthKey(k)) keys.add(k); });
  for(let i=0; i<=FUTURE_AHEAD; i++){ keys.add(addMonths(todayKey, i)); }
  return Array.from(keys).sort();
}

function cronoSections(){
  return [PENDENCIAS_SECTION, ...visibleMonthKeys().map(getMonthSection)];
}

function sectionForDate(iso){
  if(!iso) return 'pendencias';
  return iso.slice(0,7);
}

function sectionTitleById(id){
  if(id === 'pendencias') return 'Pendências sem data';
  if(isMonthKey(id)) return monthTitle(id);
  const cat = CATS.find(c => c.id === id);
  return cat ? cat.title : id;
}

function formatDateBR(iso){
  if(!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}`;
}

function renderTags(it){
  if(it.priority === 'compromisso'){

  let html = `<span class="tag ${it.priority}">${PRIORITY_LABEL[it.priority]}</span>`;
  if(it.date){
    html += `<span class="tag compromisso">${formatDateBR(it.date)}</span>`;
  }
  return html;
}

function customId(secId, idx){ return secId + '-c' + idx; }

function sectionAllItems(sec){
  const extra = (customItems[sec.id] || []).map((it, idx) => ({...it, _id: customId(sec.id, idx), _custom:true, _idx: idx}));
  const base = sec.items.map((it, idx) => ({...it, _id: itemId(sec.id, idx), _custom:false}));
  return [...base, ...extra];
}

async function loadState(){
  try{
    const res = await window.storage.get('checklist-state');
    state = res ? JSON.parse(res.value) : {};
  }catch(e){
    state = {};
  }
  try{
    const res2 = await window.storage.get('checklist-custom-items');
    customItems = res2 ? JSON.parse(res2.value) : {};
  }catch(e){
    customItems = {};
  }
  openSections = new Set([CATS[0].id]);
  selectedSection = monthKeyFromDate(new Date());
  render();
}

let saveTimer = null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{ await window.storage.set('checklist-state', JSON.stringify(state)); }
    catch(e){ console.error('Falha ao salvar', e); }
  }, 250);
}

let saveCustomTimer = null;
function persistCustom(){
  clearTimeout(saveCustomTimer);
  saveCustomTimer = setTimeout(async () => {
    try{ await window.storage.set('checklist-custom-items', JSON.stringify(customItems)); }
    catch(e){ console.error('Falha ao salvar tarefas novas', e); }
  }, 250);
}

function addCustomItem(secId, text, priority, date){
  text = text.trim();
  if(!text) return;
  if(!customItems[secId]) customItems[secId] = [];
  customItems[secId].push({text, priority, date: date || null});
  persistCustom();
  render();
}

function removeCustomItem(secId, idx){
  const id = customId(secId, idx);
  customItems[secId].splice(idx, 1);
  delete state[id];
  const shifted = {};
  Object.keys(state).forEach(k => {
    if(k.startsWith(secId + '-c')){
      const n = parseInt(k.slice((secId+'-c').length), 10);
      if(n > idx){ shifted[customId(secId, n-1)] = state[k]; delete state[k]; }
    }
  });
  Object.assign(state, shifted);
  persist();
  persistCustom();
  render();
}

function toggle(id){
  state[id] = !state[id];
  persist();
  render();
}

let openSections = new Set();
let selectedSection = null;
let monthDropdownOpen = false;
let closedSubgroups = new Set();
function toggleOpen(id){
  if(openSections.has(id)) openSections.delete(id); else openSections.add(id);
  render();
}

// ---------------------------------------------------------------
// RENDER
// ---------------------------------------------------------------
function sectionStats(sec){
  const all = sectionAllItems(sec);
  const total = all.length;
  const done = all.reduce((acc, it) => acc + (state[it._id] ? 1 : 0), 0);
  return {total, done};
}

function renderItemRow(it, sec){
  const isDone = !!state[it._id];
  const tag = renderTags(it);
  const removeBtn = it._custom
    ? `<div class="remove-btn" data-secid="${sec.id}" data-idx="${it._idx}">×</div>`
    : '';
  return `
    <div class="item ${isDone?'done':''}">
      <div class="checkbox ${isDone?'checked':''}" data-id="${it._id}"></div>
      <div class="item-main">
        <div class="item-text">${it.text}</div>
        <div class="item-tags">${tag}</div>
      </div>
      ${removeBtn}
    </div>`;
}

function renderItemsList(sec){
  const items = sectionAllItems(sec).filter(it => !(hideDone && state[it._id]));
  let html = '';
  let i = 0;
  while(i < items.length){
    const g = items[i].group || null;
    if(!g){
      html += renderItemRow(items[i], sec);
      i++;
    } else {
      let j = i;
      let blockHtml = '';
      while(j < items.length && (items[j].group || null) === g){
        blockHtml += renderItemRow(items[j], sec);
        j++;
      }
      const key = sec.id + '::' + g;
      const isClosed = closedSubgroups.has(key);
      html += `
        <div class="subgroup-label" data-subgroup="${key}">
          <span>${g}</span>
          <div class="subchevron ${isClosed?'closed':''}"></div>
        </div>
        <div class="subgroup-body" style="display:${isClosed?'none':'block'}">${blockHtml}</div>`;
      i = j;
    }
  }
  return html;
}

function renderGroup(sec){
  const {total, done} = sectionStats(sec);
  const isOpen = openSections.has(sec.id);
  const pct = total ? Math.round(done/total*100) : 0;
  const itemsHtml = renderItemsList(sec);

  return `
    <div class="group ${isOpen?'open':''}" data-groupid="${sec.id}">
      <div class="group-head" data-toggle="${sec.id}">
        <div class="group-title-wrap">
          <p class="group-title">${sec.title}</p>
        </div>
        <div class="group-meta">
          <span class="group-count">${done}/${total}</span>
          <div class="chevron"></div>
        </div>
      </div>
      <div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div>
      <div class="group-body">${itemsHtml}</div>
    </div>`;
}

function renderMonthBox(){
  const sections = cronoSections();
  const current = sections.find(s => s.id === selectedSection) || sections[0];
  const currentLabel = current.id === 'pendencias' ? 'Pendências sem data' : current.title;

  const optionsHtml = sections.map(sec => {
    const {total, done} = sectionStats(sec);
    const lbl = sec.id === 'pendencias' ? 'Pendências sem data' : sec.title;
    const isSel = sec.id === selectedSection;
    return `
      <div class="month-option ${isSel?'selected':''}" data-secid="${sec.id}">
        <span>${lbl}</span>
        <span class="month-option-count">${done}/${total}</span>
      </div>`;
  }).join('');

  return `
    <div class="month-box">
      <div class="month-select">
        <button class="month-select-trigger" id="monthSelectTrigger" type="button">
          <span>${currentLabel}</span>
          <div class="chevron ${monthDropdownOpen?'open':''}"></div>
        </button>
        <div class="month-select-panel" style="display:${monthDropdownOpen?'block':'none'}">
          ${optionsHtml}
        </div>
      </div>
    </div>`;
}

function renderCronoDetail(){
  const sec = cronoSections().find(s => s.id === selectedSection) || cronoSections()[0];
  const {total, done} = sectionStats(sec);
  const pct = total ? Math.round(done/total*100) : 0;
  const isCurrentMonth = sec.id === monthKeyFromDate(new Date());
  const badges = [];
  if(sec.subtitle) badges.push(`<span class="group-badge subtitle-badge">${sec.subtitle}</span>`);
  if(isCurrentMonth) badges.push(`<span class="group-badge current-badge">mês atual</span>`);
  const itemsHtml = renderItemsList(sec);

  return `
    <div class="group open" data-groupid="${sec.id}">
      <div class="group-head" style="cursor:default">
        <div class="group-title-wrap">
          <p class="group-title">${sec.title} ${badges.join(' ')}</p>
        </div>
        <div class="group-meta">
          <span class="group-count">${done}/${total}</span>
        </div>
      </div>
      <div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div>
      <div class="group-body" style="display:block">${itemsHtml || '<div class="item"><div class="item-main"><div class="item-text" style="color:var(--ink-soft)">Nenhuma tarefa por aqui ainda.</div></div></div>'}</div>
    </div>`;
}

function renderEnxoval(){
  let rows = ENXOVAL.map(r => `
    <tr><td><strong>${r.cat}</strong></td><td>${r.br}</td><td>${r.pt}</td></tr>
  `).join('');
  return `
    <div class="ref-card">
      <h3 class="serif">Enxoval de referência</h3>
      <p class="ref-note">O que levar do Brasil x o que comprar em Portugal (sem checkbox — é só consulta).</p>
      <table class="enxoval">
        <tr><th>Categoria</th><th>Levamos do Brasil</th><th>Compramos em Portugal</th></tr>
        ${rows}
      </table>
    </div>`;
}

function overallStats(){
  let total = 0, done = 0;
  allSections().forEach(sec => {
    sectionAllItems(sec).forEach((it) => {
      total++;
      if(state[it._id]) done++;
    });
  });
  return {total, done};
}

function updateHeader(){
  const {total, done} = overallStats();
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('overallFill').style.width = pct + '%';
  document.getElementById('overallPct').textContent = pct + '%';
  document.getElementById('overallText').textContent = `${done} de ${total} tarefas concluídas`;
  document.getElementById('dateLine').textContent = monthTitle(monthKeyFromDate(new Date()));

  const now = new Date();
  const target = new Date(TRIP_DATE + 'T00:00:00-03:00');
  const diffMs = target - now;
  const days = Math.ceil(diffMs / (1000*60*60*24));
  const row = document.getElementById('countdownRow');
  if(days >= 0){
    row.style.display = 'flex';
    document.getElementById('countdownNum').textContent = days;
  } else {
    row.style.display = 'none';
  }
}

let activeTab = 'crono';
function render(){
  updateHeader();
  const cronoHtml = renderMonthBox() + renderCronoDetail();
  const catHtml = CATS.map(renderGroup).join('') + renderEnxoval();
  document.getElementById('cronoView').innerHTML = cronoHtml;
  document.getElementById('catView').innerHTML = catHtml;
  document.getElementById('cronoView').style.display = activeTab === 'crono' ? 'block' : 'none';
  document.getElementById('catView').style.display = activeTab === 'cat' ? 'block' : 'none';

  const {total, done} = overallStats();
  document.getElementById('viewCount').textContent = `${total-done} pendentes`;

  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('.checkbox').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); toggle(el.dataset.id); };
  });
  document.querySelectorAll('.group-head[data-toggle]').forEach(el => {
    el.onclick = () => toggleOpen(el.dataset.toggle);
  });
  document.querySelectorAll('.remove-btn').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      removeCustomItem(el.dataset.secid, parseInt(el.dataset.idx, 10));
    };
  });
  document.querySelectorAll('.month-chip').forEach(el => {
    el.onclick = () => { selectedSection = el.dataset.secid; render(); };
  });
  const trigger = document.getElementById('monthSelectTrigger');
  if(trigger){
    trigger.onclick = (e) => {
      e.stopPropagation();
      monthDropdownOpen = !monthDropdownOpen;
      render();
    };
  }
  document.querySelectorAll('.month-option').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      selectedSection = el.dataset.secid;
      monthDropdownOpen = false;
      render();
    };
  });
  document.querySelectorAll('.subgroup-label').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const key = el.dataset.subgroup;
      if(closedSubgroups.has(key)) closedSubgroups.delete(key); else closedSubgroups.add(key);
      render();
    };
  });
}

function submitGlobalAdd(){
  const textEl = document.getElementById('globalAddText');
  const dateEl = document.getElementById('globalAddDate');
  const priorityEl = document.getElementById('globalAddPriority');
  const text = textEl.value.trim();
  if(!text) return;
  const secId = sectionForDate(dateEl.value);
  addCustomItem(secId, text, priorityEl.value, dateEl.value);
  textEl.value = '';
  dateEl.value = '';
  priorityEl.value = 'normal';
  document.getElementById('globalAddHint').textContent = 'Sem data escolhida → vai para "Pendências sem data"';
  activeTab = 'crono';
  document.getElementById('tabCronoBtn').classList.add('active');
  document.getElementById('tabCatBtn').classList.remove('active');
  selectedSection = secId;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
  textEl.focus();
}

document.getElementById('globalAddBtn').onclick = submitGlobalAdd;
document.getElementById('globalAddText').onkeydown = (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); submitGlobalAdd(); }
};
document.getElementById('globalAddDate').onchange = (e) => {
  const hint = document.getElementById('globalAddHint');
  if(!e.target.value){
    hint.textContent = 'Sem data escolhida → vai para "Pendências sem data"';
  } else {
    const secId = sectionForDate(e.target.value);
    hint.textContent = `Vai para: ${sectionTitleById(secId)}`;
  }
};

document.getElementById('tabCronoBtn').onclick = () => {
  activeTab = 'crono';
  document.getElementById('tabCronoBtn').classList.add('active');
  document.getElementById('tabCatBtn').classList.remove('active');
  render();
};
document.getElementById('tabCatBtn').onclick = () => {
  activeTab = 'cat';
  document.getElementById('tabCatBtn').classList.add('active');
  document.getElementById('tabCronoBtn').classList.remove('active');
  render();
};
document.getElementById('hideDone').onchange = (e) => {
  hideDone = e.target.checked;
  render();
};

loadState();
setInterval(updateHeader, 1000 * 60 * 30);
document.addEventListener('click', () => {
  if(monthDropdownOpen){
    monthDropdownOpen = false;
    render();
  }
});
</script>
</body>
</html>
