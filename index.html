<style>
  :root{
    --paper:#F6F1E4;
    --paper-raised:#FFFDF7;
    --ink:#1B2A33;
    --ink-soft:#4A5A62;
    --blue:#1F4E6B;
    --blue-tint:#E3EDF1;
    --blue-line:#C7D9DF;
    --terracotta:#B15A3E;
    --terracotta-tint:#F5E3DC;
    --ochre:#B4832C;
    --ochre-tint:#F2E7D2;
    --sage:#4C7358;
    --sage-tint:#E2ECE2;
    --hairline:#D9D2BE;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}

  /* ---------- Header ---------- */
  header{
    background:var(--blue);
    color:var(--paper);
    padding:28px 20px 22px;
    position:relative;
    overflow:hidden;
    border-bottom:3px solid var(--terracotta);
  }
  header .tiles{
    position:absolute; inset:0;
    background-image:
      linear-gradient(45deg, rgba(255,255,255,.045) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(255,255,255,.045) 25%, transparent 25%);
    background-size:34px 34px;
    opacity:.6;
    pointer-events:none;
  }
  header .inner{position:relative; max-width:640px; margin:0 auto;}
  header .eyebrow{
    font-size:12.5px;
    letter-spacing:.02em;
    color:#BFD6E1;
    margin:0 0 6px;
  }
  header h1{
    font-size:26px;
    font-weight:600;
    margin:0 0 4px;
    line-height:1.15;
  }
  header .sub{
    font-size:13.5px;
    color:#CFE0E8;
    margin:0 0 18px;
  }
  .countdown-row{
    display:flex; gap:14px; align-items:flex-end;
    margin-bottom:16px;
  }
  .countdown-num{font-size:40px; font-weight:600; line-height:1;}
  .countdown-label{font-size:12.5px; color:#CFE0E8; padding-bottom:4px;}
  .progress-shell{
    background:rgba(255,255,255,.16);
    border-radius:20px;
    height:8px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--terracotta);
    border-radius:20px;
    transition:width .4s ease;
  }
  .progress-caption{
    font-size:12px; color:#CFE0E8; margin-top:7px;
    display:flex; justify-content:space-between;
  }

  /* ---------- Header background photo overlay ---------- */
  .header-overlay{
    position:absolute; inset:0;
    background:rgba(15,35,46,0);
    transition:background .3s;
    pointer-events:none;
  }
  header.has-photo{
    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
  }
  header.has-photo .header-overlay{
    background:rgba(15,35,46,.5);
  }

  /* ---------- Global add bar ---------- */
  .global-add{
    background:var(--blue-tint);
    border-bottom:1px solid var(--blue-line);
  }
  .global-add-inner{
    max-width:640px; margin:0 auto;
    padding:14px 20px 4px;
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .global-add-hint{
    max-width:640px; margin:0 auto;
    padding:0 20px 12px;
    font-size:12px;
    color:var(--blue);
    font-weight:600;
  }

  /* ---------- Tabs ---------- */
  .tabbar{
    max-width:640px; margin:0 auto;
    display:flex; gap:6px;
    padding:14px 20px 0;
  }
  .tabbtn{
    flex:1;
    font-family:'Space Grotesk',sans-serif;
    font-size:13px; font-weight:600;
    padding:10px 8px;
    border:1px solid var(--hairline);
    background:var(--paper-raised);
    color:var(--ink-soft);
    cursor:pointer;
    border-radius:var(--radius);
  }
  .tabbtn.active{
    background:var(--blue);
    color:var(--paper);
    border-color:var(--blue);
  }

  main{max-width:640px; margin:0 auto; padding:16px 20px 8px;}

  /* ---------- Month box (mês seletor) ---------- */
  .month-box{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--paper);
    padding:12px 0 16px;
    margin-bottom:4px;
  }
  .month-select{position:relative;}
  .month-select-trigger{
    width:100%;
    display:flex; align-items:center; justify-content:space-between;
    font-family:'Space Grotesk',sans-serif;
    font-size:14.5px; font-weight:600;
    padding:12px 14px;
    border:1px solid var(--blue-line);
    border-radius:8px;
    background:var(--paper-raised);
    color:var(--ink);
    cursor:pointer;
  }
  .month-select-trigger .chevron{
    width:8px; height:8px;
    border-right:2px solid var(--ink-soft);
    border-bottom:2px solid var(--ink-soft);
    transform:rotate(45deg);
    transition:transform .2s ease;
    flex-shrink:0;
  }
  .month-select-trigger .chevron.open{transform:rotate(-135deg);}
  .month-select-panel{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:var(--paper-raised);
    border:1px solid var(--blue-line);
    border-radius:8px;
    box-shadow:0 8px 22px rgba(27,42,51,.14);
    max-height:320px; overflow-y:auto;
    z-index:20;
  }
  .month-option{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 14px;
    font-size:14px; font-weight:500;
    color:var(--ink);
    cursor:pointer;
    border-bottom:1px solid #ECE6D6;
  }
  .month-option:last-child{border-bottom:none;}
  .month-option:hover{background:var(--blue-tint);}
  .month-option.selected{background:var(--blue); color:var(--paper); font-weight:600;}
  .month-option-count{font-size:12px; opacity:.8;}

  /* ---------- Section (accordion group) ---------- */
  .group{
    background:var(--paper-raised);
    border:1px solid var(--hairline);
    margin-bottom:12px;
    border-radius:var(--radius);
    overflow:hidden;
  }
  .group.is-current{border-color:var(--blue);}
  .group-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    cursor:pointer;
    gap:10px;
  }
  .group-head:active{background:var(--blue-tint);}
  .group-title-wrap{min-width:0;}
  .group-title{font-size:16.5px; font-weight:600; margin:0; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .group-badge{font-size:12px; color:var(--ink-soft); font-weight:400; font-family:'Space Grotesk',sans-serif;}
  .group-badge.subtitle-badge{color:var(--blue); font-weight:600;}
  .group-badge.current-badge{color:var(--sage); font-weight:600;}
  .group-meta{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .group-count{font-size:12px; color:var(--ink-soft); white-space:nowrap;}
  .chevron{
    width:9px; height:9px;
    border-right:2px solid var(--ink-soft);
    border-bottom:2px solid var(--ink-soft);
    transform:rotate(45deg);
    transition:transform .2s ease;
    flex-shrink:0;
  }
  .group.open .chevron{transform:rotate(-135deg);}
  .mini-bar{height:3px; background:var(--hairline);}
  .mini-fill{height:100%; background:var(--sage);}

  .group-body{display:none; border-top:1px solid var(--hairline);}
  .group.open .group-body{display:block;}

  .subgroup-label{
    font-size:12px; font-weight:600; color:var(--ink-soft);
    padding:12px 16px 4px;
    background:var(--paper);
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer;
  }  .subgroup-label:active{background:var(--blue-tint);}
  .subchevron{
    width:8px; height:8px;
    border-right:2px solid var(--ink-soft);
    border-bottom:2px solid var(--ink-soft);
    transform:rotate(-135deg);
    transition:transform .2s ease;
    flex-shrink:0;
  }
  .subchevron.closed{transform:rotate(45deg);}

  .completed-section-label{
    font-size:12px; font-weight:700; color:var(--blue);
    padding:14px 16px 6px;
    background:var(--paper);
    border-top:1px solid var(--hairline);
  }
  .completed-section-label:first-child{border-top:none;}

  .item{
    display:flex; align-items:flex-start; gap:11px;
    padding:12px 16px;
    border-bottom:1px solid #ECE6D6;
  }
  .item:last-child{border-bottom:none;}
  .item.done{opacity:.55;}
  .item.done .item-text{text-decoration:line-through; text-decoration-color:var(--ink-soft);}

  .checkbox{
    width:19px; height:19px;
    border:2px solid var(--blue);
    border-radius:3px;
    flex-shrink:0;
    margin-top:1px;
    cursor:pointer;
    position:relative;
    background:var(--paper-raised);
  }
  .checkbox.checked{background:var(--sage); border-color:var(--sage);}
  .checkbox.checked::after{
    content:"";
    position:absolute; left:5px; top:1px;
    width:5px; height:10px;
    border-right:2px solid white;
    border-bottom:2px solid white;
    transform:rotate(40deg);
  }

  .item-main{flex:1; min-width:0;}
  .item-text{font-size:14.5px; line-height:1.4;}
  .item-tags{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .tag{
    font-size:11px;
    padding:2px 7px;
    border-radius:20px;
    font-weight:600;
    white-space:nowrap;
  }
  .tag.muitoAlta{background:var(--terracotta-tint); color:var(--terracotta);}
  .tag.alta{background:var(--ochre-tint); color:var(--ochre);}
  .tag.normal{background:var(--blue-tint); color:var(--blue);}
  .tag.compromisso{background:#EDE6F5; color:#5B3E8A;}

  .remove-btn{
    flex-shrink:0;
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
    font-size:16px;
    cursor:pointer;
    border-radius:50%;
  }
  .remove-btn:active{background:var(--terracotta-tint); color:var(--terracotta);}

  .edit-btn{
    flex-shrink:0;
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
    font-size:13px;
    cursor:pointer;
    border-radius:50%;
  }
  .edit-btn:active{background:var(--blue-tint); color:var(--blue);}

  .cal-btn{
    flex-shrink:0;
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    cursor:pointer;
    border-radius:50%;
  }
  .cal-btn:active{background:var(--sage-tint);}

  .item.editing{display:block; padding:14px 16px;}
  .edit-form{display:flex; flex-direction:column; gap:8px;}
  .edit-input{
    font-family:'Space Grotesk',sans-serif;
    font-size:14.5px;
    padding:9px 10px;
    border:1px solid var(--blue-line);
    border-radius:var(--radius);
    background:var(--paper-raised);
    color:var(--ink);
  }
  .edit-row2{display:flex; gap:8px;}
  .edit-row2 .edit-priority, .edit-row2 .edit-date{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    padding:8px;
    border:1px solid var(--blue-line);
    border-radius:var(--radius);
    background:var(--paper-raised);
    color:var(--ink);
  }
  .edit-row2 .edit-priority{flex:1;}
  .edit-actions{display:flex; gap:8px; justify-content:flex-end;}
  .edit-save-btn, .edit-cancel-btn{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px; font-weight:600;
    padding:8px 14px;
    border-radius:var(--radius);
    cursor:pointer;
    border:1px solid var(--blue-line);
  }
  .edit-save-btn{background:var(--blue); color:var(--paper); border-color:var(--blue);}
  .edit-cancel-btn{background:var(--paper-raised); color:var(--ink-soft);}

  .add-input{
    flex:1 1 140px;
    min-width:0;
    font-family:'Space Grotesk',sans-serif;
    font-size:14px;
    padding:9px 10px;
    border:1px solid var(--blue-line);
    border-radius:var(--radius);
    background:var(--paper-raised);
    color:var(--ink);
  }
  .add-input:focus{outline:2px solid var(--blue); outline-offset:1px;}
  .add-date{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    padding:8px 8px;
    border:1px solid var(--blue-line);
    border-radius:var(--radius);
    background:var(--paper-raised);
    color:var(--ink);
    flex:0 0 auto;
  }
  .add-priority{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    padding:9px 6px;
    border:1px solid var(--blue-line);
    border-radius:var(--radius);
    background:var(--paper-raised);
    color:var(--ink);
  }
  .add-btn{
    font-family:'Space Grotesk',sans-serif;
    font-size:13.5px; font-weight:600;
    padding:9px 14px;
    border:none;
    border-radius:var(--radius);
    background:var(--blue);
    color:var(--paper);
    cursor:pointer;
  }
  .add-btn:active{background:#173d54;}

  /* ---------- Reference table (enxoval) ---------- */
  .ref-card{
    background:var(--paper-raised);
    border:1px solid var(--hairline);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:20px;
  }
  .ref-card h3{font-size:15px; margin:0 0 3px;}
  .ref-card .ref-note{font-size:12.5px; color:var(--ink-soft); margin:0 0 12px;}
  table.enxoval{width:100%; border-collapse:collapse; font-size:13px;}
  table.enxoval th{
    text-align:left; font-family:'Space Grotesk',sans-serif; font-weight:600;
    font-size:11.5px; color:var(--ink-soft);
    padding:0 8px 8px 0; border-bottom:1px solid var(--hairline);
  }
  table.enxoval td{
    padding:9px 8px 9px 0; border-bottom:1px solid #ECE6D6;
    vertical-align:top; line-height:1.5;
  }

  .filter-row{
    display:flex; align-items:center; justify-content:space-between;
    margin:2px 2px 14px;
    font-size:12.5px; color:var(--ink-soft);
  }
  .filter-row label{display:flex; align-items:center; gap:7px; cursor:pointer;}
  .filter-row input{width:15px; height:15px;}

  footer{
    max-width:640px; margin:0 auto; padding:10px 22px 30px;
    font-size:11.5px; color:var(--ink-soft);
  }
</style>
</head>

<header id="mainHeader">
  <div class="tiles"></div>
  <div class="header-overlay"></div>
  <div class="inner">
    <p class="eyebrow">Danilo &amp; Lari</p>
    <h1>Organizador de Tarefas</h1>
    <p class="sub" id="dateLine">—</p>
    <div class="countdown-row" id="countdownRow" style="display:none">

    <div class="progress-caption"><span id="overallText">carregando…</span><span id="overallPct">0%</span></div>
    <div class="progress-caption" id="syncRow" style="margin-top:4px"><span id="syncLabel"></span></div>
  </div>
  </div>
</header>

<div class="global-add">

    <input type="text" class="add-input" id="globalAddText" placeholder="Nova tarefa…">

    <select class="add-priority" id="globalAddPriority">
      <option value="normal">Normal</option>
      <option value="alta">Alta</option>
      <option value="muitoAlta">Urgente</option>
    </select>
    <button class="add-btn" id="globalAddBtn">Adicionar</button>
  </div>
  <div class="global-add-hint" id="globalAddHint">Sem data escolhida → vai para "Pendências sem data"</div>
</div>

<div class="tabbar">
  <button class="tabbtn active" id="tabCronoBtn">Cronograma</button>
  <button class="tabbtn" id="tabCatBtn">Checklists</button>
  <button class="tabbtn" id="tabDoneBtn">Concluídas</button>
</div>

<main>
  <div class="filter-row">
    <label><input type="checkbox" id="hideDone"> Ocultar concluídos</label>
    <span id="viewCount"></span>
  </div>
  <div id="cronoView"></div>
  <div id="catView" style="display:none"></div>
  <div id="doneView" style="display:none"></div>
</main>

<footer>
  Toque num item para marcar como feito. O progresso fica salvo automaticamente na sua conta.
</footer>

function pad2(n){ return String(n).padStart(2,'0'); }
function monthKeyFromDate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`; }
function monthTitle(key){
  const [y,m] = key.split('-').map(Number);
  return `${MONTH_NAMES_PT[m-1]} ${y}`;
}
function monthShort(key){
  const [y,m] = key.split('-').map(Number);
  return `${MONTH_SHORT_PT[m-1]} ${y}`;
}
function addMonths(key, n){
  let [y,m] = key.split('-').map(Number);
  m += n;
  while(m>12){ m-=12; y++; }
  while(m<1){ m+=12; y--; }
  return `${y}-${pad2(m)}`;
}
function isMonthKey(k){ return /^\d{4}-\d{2}$/.test(k); }

function getMonthSection(key){
  const base = MONTHS_BASE.find(m => m.id === key);
  if(base) return base;
  return {id:key, title:monthTitle(key), subtitle:'', items:[]};
}

function visibleMonthKeys(){
  const todayKey = monthKeyFromDate(new Date());
  const keys = new Set();
  MONTHS_BASE.forEach(m => keys.add(m.id));
  Object.keys(customItems).forEach(k => { if(isMonthKey(k)) keys.add(k); });
  for(let i=0; i<=FUTURE_AHEAD; i++){ keys.add(addMonths(todayKey, i)); }
  return Array.from(keys).sort();
}

function cronoSections(){
  return [PENDENCIAS_SECTION, ...visibleMonthKeys().map(getMonthSection)];
}

function sectionForDate(iso){
  if(!iso) return 'pendencias';
  return iso.slice(0,7);
}

function sectionTitleById(id){
  if(id === 'pendencias') return 'Pendências sem data';
  if(isMonthKey(id)) return monthTitle(id);
  const cat = CATS.find(c => c.id === id);
  return cat ? cat.title : id;
}

function formatDateBR(iso){
  if(!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}`;
}

function renderTags(it){
  if(it.priority === 'compromisso'){
    return `<span class="tag compromisso">${it.date}</span>`;
  }
  let html = `<span class="tag ${it.priority}">${PRIORITY_LABEL[it.priority]}</span>`;
  if(it.date){
    html += `<span class="tag compromisso">${formatDateBR(it.date)}</span>`;
  }
  return html;
}

function customId(secId, idx){ return secId + '-c' + idx; }

function applyOverride(it){
  const ov = overrides[it._id];
  if(!ov) return it;
  return {...it, text: ov.text, priority: ov.priority, date: ov.date || undefined};
}

function sectionAllItems(sec){
  const extra = (customItems[sec.id] || []).map((it, idx) => applyOverride({...it, _id: customId(sec.id, idx), _custom:true, _idx: idx}));
  const base = sec.items.map((it, idx) => applyOverride({...it, _id: itemId(sec.id, idx), _custom:false}));
  return [...base, ...extra];
}

let syncStatus = 'loading'; // 'loading' | 'synced' | 'offline'

async function loadState(){
  try{
    const { data, error } = await sb.from('app_data').select('key,value').in('key', ['state','customItems','overrides']);
    if(error) throw error;
    const stateRow = data.find(r => r.key === 'state');
    const customRow = data.find(r => r.key === 'customItems');
    const overridesRow = data.find(r => r.key === 'overrides');
    state = stateRow ? stateRow.value : {};
    customItems = customRow ? customRow.value : {};
    overrides = overridesRow ? overridesRow.value : {};
    syncStatus = 'synced';
  }catch(e){
    console.error('Falha ao carregar do Supabase', e);
    state = {};
    customItems = {};
    overrides = {};
    syncStatus = 'offline';
  }
  openSections = new Set([CATS[0].id]);
  selectedSection = monthKeyFromDate(new Date());
  render();
  subscribeRealtime();
}

function subscribeRealtime(){
  sb.channel('app_data_changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'app_data'}, (payload) => {
      const row = payload.new;
      if(!row) return;
      if(row.key === 'state') state = row.value;
      if(row.key === 'customItems') customItems = row.value;
      if(row.key === 'overrides') overrides = row.value;
      render();
    })
    .subscribe();
}

let saveTimer = null;

function addCustomItem(secId, text, priority, date){
  text = text.trim();
  if(!text) return;
  if(!customItems[secId]) customItems[secId] = [];
  customItems[secId].push({text, priority, date: date || null});
  persistCustom();
  render();
}

function removeCustomItem(secId, idx){
  const id = customId(secId, idx);
  customItems[secId].splice(idx, 1);
  delete state[id];
  const shifted = {};
  Object.keys(state).forEach(k => {
    if(k.startsWith(secId + '-c')){
      const n = parseInt(k.slice((secId+'-c').length), 10);
      if(n > idx){ shifted[customId(secId, n-1)] = state[k]; delete state[k]; }
    }
  });
  Object.assign(state, shifted);
  persist();
  persistCustom();
  render();
}

function toggle(id){
  state[id] = !state[id];
  persist();
  render();
}

function addDaysISO(iso, n){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}

function isoDateForItem(it, sec){
  if(!it.date) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(it.date)) return it.date;
  const m = it.date.match(/(\d{2})\/(\d{2})$/);
  if(!m) return null;
  const day = m[1], month = m[2];
  const year = isMonthKey(sec.id) ? sec.id.split('-')[0] : '2026';
  return `${year}-${month}-${day}`;
}

function gcalUrlForItem(it, sec){
  const iso = isoDateForItem(it, sec);
  if(!iso) return null;
  const start = iso.replace(/-/g,'');
  const end = addDaysISO(iso, 1).replace(/-/g,'');
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: it.text,
    dates: `${start}/${end}`,
    details: 'Adicionado pelo Organizador de Tarefas'
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

function renderItemRow(it, sec){
  if(editingItemId === it._id){
    return renderEditRow(it, sec);
  }
  const isDone = !!state[it._id];
  const tag = renderTags(it);
  const removeBtn = it._custom
    ? `<div class="remove-btn" data-secid="${sec.id}" data-idx="${it._idx}">×</div>`
    : '';
  const gcalUrl = gcalUrlForItem(it, sec);
  const calBtn = gcalUrl
    ? `<div class="cal-btn" data-url="${escapeHtml(gcalUrl)}">📅</div>`
    : '';
  return `
    <div class="item ${isDone?'done':''}">
      <div class="checkbox ${isDone?'checked':''}" data-id="${it._id}"></div>
      <div class="item-main">
        <div class="item-text">${it.text}</div>
        <div class="item-tags">${tag}</div>
      </div>
      ${calBtn}
      <div class="edit-btn" data-secid="${sec.id}" data-itemid="${it._id}">✎</div>
      ${removeBtn}
    </div>`;
}

function renderItemsList(sec){
  const items = sectionAllItems(sec).filter(it => !(hideDone && state[it._id]));
  let html = '';
  let i = 0;
  while(i < items.length){
    const g = items[i].group || null;
    if(!g){
      html += renderItemRow(items[i], sec);
      i++;
    } else {
      let j = i;
      let blockHtml = '';
      while(j < items.length && (items[j].group || null) === g){
        blockHtml += renderItemRow(items[j], sec);
        j++;
      }
      const key = sec.id + '::' + g;
      const isClosed = closedSubgroups.has(key);
      html += `
        <div class="subgroup-label" data-subgroup="${key}">
          <span>${g}</span>
          <div class="subchevron ${isClosed?'closed':''}"></div>
        </div>
        <div class="subgroup-body" style="display:${isClosed?'none':'block'}">${blockHtml}</div>`;
      i = j;
    }
  }
  return html;
}

  return `

  else syncLabel.textContent = '· Conectando…';

  const now = new Date();
  const target = new Date(TRIP_DATE + 'T00:00:00-03:00');

  const days = Math.ceil(diffMs / (1000*60*60*24));

  return {it, sec};
}

function attachHandlers(){
  document.querySelectorAll('.checkbox').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); toggle(el.dataset.id); };
  });
  document.querySelectorAll('.group-head[data-toggle]').forEach(el => {
    el.onclick = () => toggleOpen(el.dataset.toggle);
  });
  document.querySelectorAll('.remove-btn').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      removeCustomItem(el.dataset.secid, parseInt(el.dataset.idx, 10));
    };
  });
  document.querySelectorAll('.edit-btn').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      editingItemId = el.dataset.itemid;
      render();
    };
  });
  document.querySelectorAll('.cal-btn').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      window.open(el.dataset.url, '_blank');
    };
  });
  document.querySelectorAll('.edit-save-btn').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const found = findItemAndSection(el.dataset.secid, el.dataset.itemid);
      if(found) saveEdit(found.it, found.sec);
    };
  });
  document.querySelectorAll('.edit-cancel-btn').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      editingItemId = null;
      render();
    };
  });
  document.querySelectorAll('.month-chip').forEach(el => {
    el.onclick = () => { selectedSection = el.dataset.secid; render(); };
  });
  const trigger = document.getElementById('monthSelectTrigger');
  if(trigger){
    trigger.onclick = (e) => {
      e.stopPropagation();
      monthDropdownOpen = !monthDropdownOpen;
      render();
    };
  }
  document.querySelectorAll('.month-option').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      selectedSection = el.dataset.secid;
      monthDropdownOpen = false;
      render();
    };
  });
  document.querySelectorAll('.subgroup-label').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const key = el.dataset.subgroup;
      if(closedSubgroups.has(key)) closedSubgroups.delete(key); else closedSubgroups.add(key);
      render();
    };
  });
}

function submitGlobalAdd(){
  const textEl = document.getElementById('globalAddText');
  const dateEl = document.getElementById('globalAddDate');
  const priorityEl = document.getElementById('globalAddPriority');
  const text = textEl.value.trim();
  if(!text) return;
  const secId = sectionForDate(dateEl.value);
  addCustomItem(secId, text, priorityEl.value, dateEl.value);
  textEl.value = '';
  dateEl.value = '';
  priorityEl.value = 'normal';
  document.getElementById('globalAddHint').textContent = 'Sem data escolhida → vai para "Pendências sem data"';
  activeTab = 'crono';
  document.getElementById('tabCronoBtn').classList.add('active');
  document.getElementById('tabCatBtn').classList.remove('active');
  document.getElementById('tabDoneBtn').classList.remove('active');
  selectedSection = secId;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
  textEl.focus();
}

document.getElementById('globalAddBtn').onclick = submitGlobalAdd;
document.getElementById('globalAddText').onkeydown = (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); submitGlobalAdd(); }
};
document.getElementById('globalAddDate').onchange = (e) => {
  const hint = document.getElementById('globalAddHint');
  if(!e.target.value){
    hint.textContent = 'Sem data escolhida → vai para "Pendências sem data"';
  } else {
    const secId = sectionForDate(e.target.value);
    hint.textContent = `Vai para: ${sectionTitleById(secId)}`;
  }
};

function setActiveTab(tab){
  activeTab = tab;
  document.getElementById('tabCronoBtn').classList.toggle('active', tab==='crono');
  document.getElementById('tabCatBtn').classList.toggle('active', tab==='cat');
  document.getElementById('tabDoneBtn').classList.toggle('active', tab==='done');
  render();
}
document.getElementById('tabCronoBtn').onclick = () => setActiveTab('crono');
document.getElementById('tabCatBtn').onclick = () => setActiveTab('cat');
document.getElementById('tabDoneBtn').onclick = () => setActiveTab('done');
document.getElementById('hideDone').onchange = (e) => {
  hideDone = e.target.checked;
  render();
};

loadState();
setInterval(updateHeader, 1000 * 60 * 30);
document.addEventListener('click', () => {
  if(monthDropdownOpen){
    monthDropdownOpen = false;
    render();
  }
});
</script>
</body>
</html>
